[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pymupdf",
    "pytesseract",
    "pillow",
    "pydantic",
    "python-dotenv",
    "langchain",
    "langgraph",
    "langchain-google-genai",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
